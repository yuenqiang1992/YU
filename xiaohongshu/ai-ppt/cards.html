<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ccc;font-family:"Noto Sans SC",sans-serif}
.card{width:1080px;height:1440px;position:relative;overflow:hidden}
/* 1 cover */
#c1{background:#F4EFE6;color:#1F1F1F;padding:120px 96px}
#c1 .tag{display:inline-block;background:#E8553E;color:#fff;font-weight:700;font-size:40px;padding:14px 34px;border-radius:999px;letter-spacing:4px}
#c1 h1{font-family:"Noto Serif SC",serif;font-weight:900;font-size:118px;line-height:1.32;margin-top:200px;letter-spacing:2px}
#c1 h1 .hl{background:linear-gradient(transparent 62%,#F6C445 62%)}
#c1 h1 .red{color:#E8553E}
#c1 .sub{position:absolute;left:96px;bottom:130px;font-size:44px;color:#6b665e;letter-spacing:6px}
#c1 .sub b{color:#1F1F1F}
#c1 .emoji{position:absolute;right:90px;bottom:100px;font-size:150px}
#c1 .rule{position:absolute;left:96px;bottom:220px;width:120px;height:8px;background:#1F1F1F}
/* 2 note */
#c2{background:radial-gradient(ellipse at 30% 25%,#5a4632 0%,#2c2219 55%,#17110c 100%)}
#c2 .glow{position:absolute;left:-200px;top:-260px;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,150,.45),rgba(255,214,150,0) 65%)}
#c2 .paper{position:absolute;left:150px;top:250px;width:760px;height:900px;background:#FBF8F0;transform:rotate(-3.5deg);box-shadow:0 40px 80px rgba(0,0,0,.55);padding:90px 70px;
 background-image:repeating-linear-gradient(transparent 0 118px,#c9d6e3 118px 120px);background-position:0 70px}
#c2 .paper::before{content:"";position:absolute;left:110px;top:0;bottom:0;width:2px;background:#e8a0a0}
#c2 .hand{font-family:"Ma Shan Zheng",cursive;color:#20283a;font-size:92px;line-height:120px;position:relative;left:60px}
#c2 .hand .n{display:inline-block;width:70px}
#c2 .hand .x{text-decoration:line-through;text-decoration-color:#20283a;opacity:.55;font-size:60px}
#c2 .hand .circ{border:5px solid #c0392b;border-radius:50% 45% 55% 48%;padding:0 18px;margin-left:-18px}
#c2 .pen{position:absolute;right:70px;top:560px;width:34px;height:640px;transform:rotate(18deg);border-radius:6px;background:linear-gradient(90deg,#111 0,#3a3a3a 45%,#111 100%)}
#c2 .pen::after{content:"";position:absolute;bottom:-60px;left:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:60px solid #c9a24a}
#c2 .cap{position:absolute;left:0;right:0;bottom:90px;text-align:center;color:#f3e3c6;font-size:42px;letter-spacing:8px;opacity:.9}
/* 3 checklist */
#c3{background:#FFFFFF;color:#1F1F1F;padding:130px 96px}
#c3 .kicker{font-size:38px;color:#E8553E;font-weight:700;letter-spacing:6px}
#c3 h2{font-family:"Noto Serif SC",serif;font-weight:900;font-size:92px;line-height:1.3;margin-top:30px}
#c3 ul{list-style:none;margin-top:90px}
#c3 li{display:flex;align-items:center;gap:40px;font-size:58px;font-weight:700;padding:44px 0;border-top:3px solid #EEE}
#c3 li:last-child{border-bottom:3px solid #EEE}
#c3 .ck{flex:none;width:84px;height:84px;border-radius:20px;background:#2FA36B;color:#fff;font-size:56px;display:flex;align-items:center;justify-content:center}
#c3 li small{display:block;font-size:36px;font-weight:400;color:#8a857d;margin-top:10px}
#c3 .foot{position:absolute;left:96px;bottom:70px;font-size:36px;color:#9a948a;letter-spacing:4px}
</style></head><body>

<div class="card" id="c1">
 <span class="tag">翻车记录</span>
 <h1>AI<span class="red">三十秒</span><br>做完十页，<br>我花了<span class="hl">两小时</span>改</h1>
 <div class="rule"></div>
 <div class="sub">不是AI慢，<b>是我没想清楚</b></div>
 <div class="emoji">😅</div>
</div>

<div class="card" id="c2">
 <div class="glow"></div>
 <div class="paper">
  <div class="hand"><span class="n">1.</span>做成了什么</div>
  <div class="hand"><span class="n">2.</span>卡在哪里</div>
  <div class="hand"><span class="n">3.</span><span class="x">先做…</span>下<span class="circ">一件</span>事</div>
  <div class="hand" style="font-size:50px;opacity:.6;margin-top:120px">写这三行，花了40分钟</div>
 </div>
 <div class="pen"></div>
 <div class="cap">三行字，比十页PPT难写</div>
</div>

<div class="card" id="c3">
 <div class="kicker">我现在的小办法</div>
 <h2>想清楚，<br>比排版更费时间</h2>
 <ul>
  <li><span class="ck">✓</span><div>先别开AI，纸上写三行<small>做成了什么 · 卡在哪 · 下一件事</small></div></li>
  <li><span class="ck">✓</span><div>对自己讲一句话<small>讲不顺，就是还没想清楚</small></div></li>
  <li><span class="ck">✓</span><div>想法交给AI，只让它排版<small>它负责整理，你负责想</small></div></li>
 </ul>
 <div class="foot">#用AI过日子</div>
</div>
</body></html>
